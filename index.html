<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finko Intelligence</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #1c1f1a;
      padding: 60px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .publicacion {
      padding: 20px;
      border: 1px solid #dedad2;
      border-radius: 10px;
      background: white;
    }

    .publicacion h3 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    .fecha {
      color: #888;
      font-size: 13px;
      margin: 0 0 12px 0;
    }

    .metricas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0;
    }

    .metrica {
      background: #f1efe9;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      color: #333;
    }

    .metrica strong {
      color: #1c1f1a;
    }

    .error {
      color: #a12622;
    }

    #mensaje {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Finko Intelligence</h1>

  <p class="subtitulo">
    Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.
  </p>

  <h2>Publicaciones de Instagram</h2>

  <div id="mensaje">Cargando...</div>

  <div id="publicaciones" class="grid"></div>

  <script>
    async function cargarPublicaciones() {
      const mensaje = document.getElementById("mensaje");
      const contenedor = document.getElementById("publicaciones");

      try {
        const respuesta = await fetch("/api/publicaciones");
        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(resultado.error || "No se pudieron cargar las publicaciones.");
        }

        if (resultado.data.length === 0) {
          mensaje.textContent = "Todavía no hay publicaciones guardadas.";
          return;
        }

        mensaje.textContent = "";

        resultado.data.forEach((publicacion) => {
          const tarjeta = document.createElement("div");
          tarjeta.className = "publicacion";

          const titulo = document.createElement("h3");
          titulo.textContent = publicacion.titulo || "Publicación sin título";

          const fecha = document.createElement("p");
          fecha.className = "fecha";
          const fechaPub = publicacion.fecha_publicacion
            ? new Date(publicacion.fecha_publicacion).toLocaleDateString("es-UY")
            : "Sin fecha";
          fecha.textContent = `Publicado el ${fechaPub}`;

          const metricas = document.createElement("div");
          metricas.className = "metricas";

          const datos = [
            { etiqueta: "Alcance", valor: publicacion.alcance },
            { etiqueta: "Interacciones", valor: publicacion.interacciones },
            { etiqueta: "Guardados", valor: publicacion.guardados },
            { etiqueta: "Compartidos", valor: publicacion.compartidos },
          ];

          datos.forEach(({ etiqueta, valor }) => {
            const pill = document.createElement("span");
            pill.className = "metrica";
            pill.innerHTML = `<strong>${valor ?? 0}</strong> ${etiqueta}`;
            metricas.appendChild(pill);
          });

          tarjeta.append(titulo, fecha, metricas);
          contenedor.appendChild(tarjeta);
        });
      } catch (error) {
        mensaje.className = "error";
        mensaje.textContent = "No se pudieron cargar las publicaciones. Revisa la configuración de Supabase.";
        console.error("Error cargando publicaciones:", error);
      }
    }

    cargarPublicaciones();
  </script>

</body>
</html>
